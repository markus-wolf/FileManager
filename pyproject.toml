[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "storagemark"
dynamic = ["version"]          # single source of truth: storagemark/__init__.py
description = "Interactive terminal disk space analyzer for macOS and Linux"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Markus Wolf" }]
keywords = ["disk", "storage", "tui", "curses", "du", "cleanup"]
dependencies = [
    "textual>=8.2.8",
]

[tool.setuptools.dynamic]
version = { attr = "storagemark.__version__" }

[project.urls]
Homepage = "https://github.com/markus-wolf/FileManager"
Repository = "https://github.com/markus-wolf/FileManager"

[project.scripts]
storagemark = "storagemark.python.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["storagemark*"]

# Ship the compiled scanner AND its sources (so the runtime fallback in
# scanner.py can recompile if the prebuilt binary is missing).
[tool.setuptools.package-data]
storagemark = ["c/storagescanner", "c/*.c", "c/*.h", "c/Makefile"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fast suites by default. Run everything with: uv run pytest -m ""
# 'slow' tests scan the real home directory (~1M files, minutes).
addopts = "-m 'not slow' -q"
markers = [
    "slow: scans the full home directory; run explicitly with -m slow",
]
