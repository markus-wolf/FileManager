[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "storagemark"
version = "0.1.0"
description = "Interactive terminal disk space analyzer"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
storagemark = "storagemark.python.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["storagemark*"]
